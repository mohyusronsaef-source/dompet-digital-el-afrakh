name: Build Debug APK - Dompet Digital El Afrakh

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests & Build Debug APK
        run: |
          if [ -f "DompetDigitalElAfrakh/settings.gradle.kts" ]; then
            cd DompetDigitalElAfrakh
          fi
          gradle testDebugUnitTest assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DompetDigitalElAfrakh-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find . -path "*/app/build/outputs/apk/debug/app-debug.apk" | head -n 1)
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest "$APK_PATH" --clobber
          else
            gh release create debug-latest "$APK_PATH" \
              --title "Dompet Digital El Afrakh (Debug APK)" \
              --notes "APK Debug hasil build otomatis."
          fi
